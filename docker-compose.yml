version: "3.9"

services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_URL: http://api:8000
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./services/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./services/worker
    environment:
      APP_ENV: development
      WORKER_WORKDIR: /workspace
    volumes:
      - ./services/worker:/app
    command: python worker.py
